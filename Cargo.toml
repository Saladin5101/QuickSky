[package]
name = "quicksky"
version = "2.0.0"
edition = "2021"
description = "Lazy developer-friendly native version control tool (command: sky)"
license = "AGPL-3.0"
authors = ["Saladin5101"]
repository = "https://github.com/Saladin5101/QuickSky"
keywords = ["version-control", "git", "cli", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "sky"
path = "src/main.rs"

[dependencies]

clap = { version = "4.4", features = ["derive"] }

anyhow = "1.0"

toml = "0.8"

walkdir = "2.3"

ignore = "0.4"

chrono = "0.4"

uuid = "0.8.2"

serde = { version = "1.0", features = ["derive"] }

bincode = "1.3"

md-5 = "0.10"

sha2 = "0.10"

zstd = "0.13"

reqwest = { version = "0.11", features = ["blocking", "json"] }

url = "2.4"

serde_json = "1.0"
rand = "0.8"
lettre = { version = "0.11", features = ["smtp-transport", "builder"] }
tempfile = "3.8"
ssh2 = "0.9"
tiny_http = "0.12"
